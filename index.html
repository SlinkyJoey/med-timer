<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Med Timer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Med Timer">
<meta name="theme-color" content="#0e1116">
<style>
  :root {
    --bg: #0e1116; --card: #1a1f29; --card2: #232a37;
    --text: #eef1f6; --dim: #8b94a3;
    --red: #ff6b6b; --green: #4cd97b; --amber: #ffb454; --blue: #5aa9ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button { touch-action: manipulation; font-family: inherit; cursor: pointer; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 520px; margin: 0 auto;
  }
  h1 { font-size: 26px; padding: 8px 2px 14px; display: flex; align-items: center; justify-content: space-between; }
  h1 .add-btn {
    font-size: 17px; font-weight: 600; color: var(--blue); background: var(--card);
    border: none; border-radius: 12px; padding: 10px 16px;
  }
  .card {
    background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 14px;
  }
  .med-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .med-name { font-size: 21px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 13px; font-weight: 600; color: var(--dim); background: var(--card2); border-radius: 8px; padding: 4px 9px; }
  .edit-btn { background: none; border: none; color: var(--dim); font-size: 17px; padding: 6px 8px; }
  .countdown {
    font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 42px; font-weight: 700; letter-spacing: 1px; line-height: 1.15;
  }
  .cd-wait { color: var(--amber); }
  .cd-ok { color: var(--green); font-size: 30px; font-family: -apple-system, sans-serif; letter-spacing: 0; }
  .cd-none { color: var(--dim); font-size: 17px; font-family: -apple-system, sans-serif; font-weight: 500; letter-spacing: 0; }
  .sub { color: var(--dim); font-size: 14px; margin-top: 4px; min-height: 18px; }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .take-btn {
    flex: 1; font-size: 18px; font-weight: 700; color: #fff; background: var(--red);
    border: none; border-radius: 14px; padding: 15px 0;
  }
  .take-btn:active { opacity: .8; }
  .cal-btn {
    font-size: 15px; font-weight: 600; color: var(--blue); background: var(--card2);
    border: none; border-radius: 14px; padding: 0 16px;
  }
  h2 { font-size: 17px; color: var(--dim); padding: 14px 2px 10px; display: flex; justify-content: space-between; align-items: center; }
  h2 .actions { display: flex; gap: 16px; }
  h2 button { background: none; border: none; color: var(--blue); font-size: 15px; font-weight: 600; padding: 0; }
  .log-entry {
    background: var(--card); border-radius: 12px; padding: 11px 14px; margin-bottom: 8px;
    font-size: 14px; line-height: 1.45; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .log-entry .when { color: var(--dim); }
  .log-entry .del { background: none; border: none; color: var(--dim); font-size: 15px; padding: 4px 6px; flex-shrink: 0; }
  .empty { color: var(--dim); font-size: 15px; text-align: center; padding: 20px 0; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 30px);
    background: var(--card2); color: var(--text); padding: 12px 20px; border-radius: 14px;
    font-size: 15px; font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none;
    box-shadow: 0 6px 24px rgba(0,0,0,.45); max-width: 86vw; text-align: center; z-index: 99;
  }
  .toast.show { opacity: 1; }

  /* in-app dialogs (replaces iOS confirm/prompt, which Safari can silently swallow) */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .sheet {
    background: var(--card2); border-radius: 20px; padding: 20px; width: 100%; max-width: 400px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .dlg-title { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
  .dlg-msg { font-size: 15px; color: var(--dim); line-height: 1.45; margin-bottom: 14px; white-space: pre-line; }
  .dlg-in {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid #333c4d;
    border-radius: 12px; padding: 13px 14px; font-size: 17px; margin-bottom: 10px; font-family: inherit;
  }
  textarea.dlg-in { min-height: 110px; resize: vertical; }
  .dlg-row { display: flex; gap: 10px; margin-top: 8px; }
  .dlg-btn {
    flex: 1; border: none; border-radius: 12px; padding: 14px 0; font-size: 16px; font-weight: 600;
  }
  .dlg-cancel { background: var(--card); color: var(--text); }
  .dlg-ok { background: var(--blue); color: #fff; }
  .dlg-ok.danger { background: var(--red); }
  .dlg-extra { background: none; border: none; color: var(--red); font-size: 15px; font-weight: 600; padding: 12px 0 2px; width: 100%; text-align: center; }
  .dlg-skip { background: var(--card); color: var(--text); }
  .dlg-label { font-size: 13px; color: var(--dim); font-weight: 600; margin: 4px 0 6px; }
  .pain-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 2px 0 12px; }
  .pain-chip { border: none; border-radius: 12px; padding: 15px 0; font-size: 18px; font-weight: 700; color: #10151c; }
  .pain-chip:active { transform: scale(.94); }
</style>
</head>
<body>
<h1>💊 Med Timer <button class="add-btn" onclick="addMed()">＋ Add</button></h1>
<div id="meds"></div>
<h2>History <span class="actions">
  <button onclick="backupData()">Backup</button>
  <button onclick="restoreData()">Restore</button>
  <button onclick="exportLog()">Share / Copy</button>
</span></h2>
<div id="log"></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const MEDS_KEY = 'mt.meds', DOSES_KEY = 'mt.doses';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let meds = JSON.parse(localStorage.getItem(MEDS_KEY) || 'null');
if (!meds) {
  meds = [
    { id: 'targin',  name: 'Targin',  hours: 12 },
    { id: 'panadol', name: 'Panadol', hours: 4 },
  ];
  saveMeds();
}
let doses = JSON.parse(localStorage.getItem(DOSES_KEY) || '[]'); // newest first

function saveMeds()  { localStorage.setItem(MEDS_KEY, JSON.stringify(meds)); }
function saveDoses() { localStorage.setItem(DOSES_KEY, JSON.stringify(doses)); }

const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function fmt(ts) {
  const d = new Date(ts);
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function remainStr(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${Math.floor(s/3600)}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`;
}
function lastDose(medId) { return doses.find(d => d.medId === medId); }

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

/* In-app dialog. Returns: null (cancel), 'extra' (extra button), true (ok, no inputs),
   or array of input values (ok, with inputs). */
function dialog({ title, message = '', inputs = [], okText = 'OK', cancelText = 'Cancel', danger = false, extraText = null }) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="sheet">
      <div class="dlg-title">${esc(title)}</div>
      ${message ? `<div class="dlg-msg">${esc(message)}</div>` : ''}
      ${inputs.map((f, i) => f.type === 'textarea'
        ? `<textarea class="dlg-in" id="dlg-in-${i}" placeholder="${esc(f.placeholder || '')}"></textarea>`
        : `<input class="dlg-in" id="dlg-in-${i}" type="text" ${f.type === 'number' ? 'inputmode="decimal"' : ''}
             placeholder="${esc(f.placeholder || '')}" value="${esc(f.value ?? '')}">`).join('')}
      <div class="dlg-row">
        <button class="dlg-btn dlg-cancel">${esc(cancelText)}</button>
        <button class="dlg-btn dlg-ok${danger ? ' danger' : ''}">${esc(okText)}</button>
      </div>
      ${extraText ? `<button class="dlg-extra">${esc(extraText)}</button>` : ''}
    </div>`;
    document.body.appendChild(ov);
    const done = v => { ov.remove(); resolve(v); };
    ov.querySelector('.dlg-cancel').addEventListener('click', () => done(null));
    ov.querySelector('.dlg-ok').addEventListener('click', () =>
      done(inputs.length ? inputs.map((_, i) => ov.querySelector(`#dlg-in-${i}`).value) : true));
    if (extraText) ov.querySelector('.dlg-extra').addEventListener('click', () => done('extra'));
    ov.addEventListener('click', e => { if (e.target === ov) done(null); });
  });
}

// pain 0 (green) -> 5 (amber) -> 10 (red)
function painColor(n) {
  const a = [76,217,123], b = [255,180,84], c = [255,107,107];
  const [from, to, t] = n <= 5 ? [a, b, n/5] : [b, c, (n-5)/5];
  const mix = i => Math.round(from[i] + (to[i] - from[i]) * t);
  return `rgb(${mix(0)},${mix(1)},${mix(2)})`;
}

// Combined dose + pain logger.
// Resolves: null (cancel) or { dose: number|undefined, pain: number|undefined }.
// Commits when a pain chip is tapped (logs with that pain) or "Log, no pain rating".
function logDialog(med) {
  const last = lastDose(med.id);
  const prefill = last && last.dose != null ? last.dose
                : med.dose != null ? med.dose : '';
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    const chips = Array.from({ length: 11 }, (_, n) =>
      `<button class="pain-chip" style="background:${painColor(n)}" data-pain="${n}">${n}</button>`).join('');
    ov.innerHTML = `<div class="sheet">
      <div class="dlg-title">Log ${esc(med.name)}</div>
      <div class="dlg-label">Dosage (mg)</div>
      <input class="dlg-in" id="dlg-dose" inputmode="decimal" placeholder="e.g. 500" value="${esc(prefill)}">
      <div class="dlg-label">Pain level — tap a number to log (0 = none, 10 = worst)</div>
      <div class="pain-grid">${chips}</div>
      <div class="dlg-row">
        <button class="dlg-btn dlg-cancel">Cancel</button>
        <button class="dlg-btn dlg-skip">Log, no pain rating</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const readDose = () => {
      const v = parseFloat(ov.querySelector('#dlg-dose').value);
      return isFinite(v) && v >= 0 ? v : undefined;
    };
    const done = v => { ov.remove(); resolve(v); };
    ov.querySelectorAll('.pain-chip').forEach(b =>
      b.addEventListener('click', () => done({ dose: readDose(), pain: +b.dataset.pain })));
    ov.querySelector('.dlg-cancel').addEventListener('click', () => done(null));
    ov.querySelector('.dlg-skip').addEventListener('click', () => done({ dose: readDose(), pain: undefined }));
    ov.addEventListener('click', e => { if (e.target === ov) done(null); });
  });
}

async function takeDose(medId) {
  const m = meds.find(x => x.id === medId);
  if (!m) return;
  const last = lastDose(medId);
  const now = Date.now();
  if (last) {
    const nextAt = last.takenAt + m.hours * 3600e3;
    if (now < nextAt) {
      const ok = await dialog({
        title: `⚠️ ${m.name} isn't due yet`,
        message: `Next dose in ${remainStr(nextAt - now)} (at ${fmt(nextAt)}).\nLog this dose anyway?`,
        okText: 'Log anyway', danger: true,
      });
      if (ok !== true) return;
    }
  }
  const res = await logDialog(m);
  if (res === null) return;                  // cancelled — don't log
  const takenAt = Date.now();
  const entry = { id: takenAt + '-' + Math.random().toString(36).slice(2, 7),
                  medId, name: m.name, hours: m.hours, takenAt };
  if (res.pain != null) entry.pain = res.pain;
  if (res.dose != null) { entry.dose = res.dose; m.dose = res.dose; saveMeds(); }
  doses.unshift(entry);
  saveDoses();
  render();
  const parts = [];
  if (res.dose != null) parts.push(`${res.dose}mg`);
  if (res.pain != null) parts.push(`pain ${res.pain}/10`);
  const note = parts.length ? ` (${parts.join(', ')})` : '';
  toast(`${m.name} logged${note} — next dose at ${fmt(takenAt + m.hours * 3600e3)}`);
}

async function addMed() {
  const r = await dialog({
    title: 'Add medication',
    inputs: [{ placeholder: 'Name (e.g. Nurofen)' },
             { placeholder: 'Hours between doses', type: 'number' },
             { placeholder: 'Usual dosage in mg (optional)', type: 'number' }],
    okText: 'Add',
  });
  if (!r) return;
  const name = r[0].trim();
  const hours = parseFloat(r[1]);
  const dose = parseFloat(r[2]);
  if (!name) { toast('Name is required'); return; }
  if (!(hours > 0 && hours <= 168)) { toast('Hours must be between 0 and 168'); return; }
  const med = { id: Date.now().toString(36), name, hours };
  if (isFinite(dose) && dose >= 0) med.dose = dose;
  meds.push(med);
  saveMeds();
  render();
  toast(`${name} added — every ${hours}h`);
}

async function editMed(medId) {
  const m = meds.find(x => x.id === medId);
  if (!m) return;
  const r = await dialog({
    title: `Edit ${m.name}`,
    inputs: [{ value: m.name, placeholder: 'Name' },
             { value: m.hours, placeholder: 'Hours between doses', type: 'number' },
             { value: m.dose ?? '', placeholder: 'Usual dosage in mg (optional)', type: 'number' }],
    okText: 'Save', extraText: `Delete ${m.name}…`,
  });
  if (!r) return;
  if (r === 'extra') {
    const sure = await dialog({
      title: `Delete ${m.name}?`,
      message: 'Its history entries are kept.',
      okText: 'Delete', danger: true,
    });
    if (sure === true) {
      meds = meds.filter(x => x.id !== medId);
      saveMeds(); render();
    }
    return;
  }
  const name = r[0].trim();
  const hours = parseFloat(r[1]);
  const dose = parseFloat(r[2]);
  if (!name) { toast('Name is required'); return; }
  if (!(hours > 0 && hours <= 168)) { toast('Hours must be between 0 and 168'); return; }
  m.name = name; m.hours = hours;
  if (isFinite(dose) && dose >= 0) m.dose = dose; else delete m.dose;
  saveMeds(); render();
}

async function delDose(doseId) {
  const d = doses.find(x => x.id === doseId);
  if (!d) return;
  const sure = await dialog({
    title: 'Remove log entry?',
    message: `${d.name} · ${fmt(d.takenAt)}`,
    okText: 'Remove', danger: true,
  });
  if (sure === true) {
    doses = doses.filter(x => x.id !== doseId);
    saveDoses(); render();
  }
}

function calAlert(medId) {
  const m = meds.find(x => x.id === medId);
  const last = lastDose(medId);
  if (!m || !last) return;
  const nextAt = new Date(last.takenAt + m.hours * 3600e3);
  const u = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MedTimer//EN','BEGIN:VEVENT',
    `UID:${last.id}@medtimer`, `DTSTAMP:${u(new Date())}`, `DTSTART:${u(nextAt)}`,
    `DTEND:${u(new Date(nextAt.getTime() + 5*60e3))}`, `SUMMARY:Take ${m.name}`,
    'BEGIN:VALARM','TRIGGER:PT0S','ACTION:DISPLAY',`DESCRIPTION:Take ${m.name}`,'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  a.download = `take-${m.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
}

function backupData() {
  const payload = JSON.stringify({ app: 'medtimer', v: 1, meds, doses });
  const finish = () => toast('Backup copied — paste into Restore on the other device');
  if (navigator.share) {
    navigator.share({ title: 'Med Timer backup', text: payload })
      .catch(() => navigator.clipboard.writeText(payload).then(finish));
  } else {
    navigator.clipboard.writeText(payload).then(finish);
  }
}

async function restoreData() {
  const r = await dialog({
    title: 'Restore',
    message: 'Paste a Backup (or lines from Share / Copy):',
    inputs: [{ type: 'textarea', placeholder: 'Paste here' }],
    okText: 'Restore',
  });
  if (!r || !r[0].trim()) return;
  const txt = r[0].trim();
  try {
    if (txt.startsWith('{')) {
      const b = JSON.parse(txt);
      if (b.app !== 'medtimer' || !Array.isArray(b.meds) || !Array.isArray(b.doses)) throw 0;
      const sure = await dialog({
        title: 'Replace current data?',
        message: `This backup has ${b.meds.length} medications and ${b.doses.length} log entries.`,
        okText: 'Replace', danger: true,
      });
      if (sure !== true) return;
      meds = b.meds; doses = b.doses;
    } else {
      const items = parseLogLines(txt);
      if (!items.length) throw 0;
      const sure = await dialog({
        title: `Import ${items.length} log entr${items.length === 1 ? 'y' : 'ies'}?`,
        message: "They'll be merged with what's already here.",
        okText: 'Import',
      });
      if (sure !== true) return;
      mergeImported(items);
    }
    saveMeds(); saveDoses(); render();
    toast('Restore complete');
  } catch {
    toast("Couldn't read that — paste the exact Backup or Share / Copy text");
  }
}

// accepts shared-log lines like "12 Jun 18:34 — Targin (every 12h) — Next dose: ..."
function parseLogLines(txt) {
  const re = /^(\d{1,2}) (\w{3}) (\d{2}):(\d{2}) — (.+?) \(every ([\d.]+)h\)/;
  const out = [];
  for (const line of txt.split('\n')) {
    const m = line.trim().match(re);
    if (!m) continue;
    const mi = MONTHS.indexOf(m[2]);
    if (mi < 0) continue;
    const d = new Date(new Date().getFullYear(), mi, +m[1], +m[3], +m[4]);
    if (d.getTime() > Date.now() + 86400e3) d.setFullYear(d.getFullYear() - 1);
    const item = { name: m[5], hours: parseFloat(m[6]), takenAt: d.getTime() };
    const dm = line.match(/—\s*(\d+(?:\.\d+)?)\s*mg\b/i);
    if (dm) item.dose = parseFloat(dm[1]);
    const pm = line.match(/Pain (\d+)\/10/i);
    if (pm) item.pain = +pm[1];
    out.push(item);
  }
  return out;
}

function mergeImported(items) {
  for (const it of items) {
    let med = meds.find(x => x.name.toLowerCase() === it.name.toLowerCase());
    if (!med) {
      med = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: it.name, hours: it.hours };
      meds.push(med);
    }
    const dup = doses.some(d => d.medId === med.id && Math.abs(d.takenAt - it.takenAt) < 60e3);
    if (!dup) {
      const entry = { id: it.takenAt + '-' + Math.random().toString(36).slice(2, 7),
                      medId: med.id, name: med.name, hours: it.hours, takenAt: it.takenAt };
      if (it.dose != null) entry.dose = it.dose;
      if (it.pain != null) entry.pain = it.pain;
      doses.push(entry);
    }
  }
  doses.sort((a, b) => b.takenAt - a.takenAt);
}

function exportLog() {
  if (!doses.length) { toast('No doses logged yet'); return; }
  const text = doses.map(d =>
    `${fmt(d.takenAt)} — ${d.name} (every ${d.hours}h) — Next dose: ${fmt(d.takenAt + d.hours*3600e3)}` +
    (d.dose != null ? ` — ${d.dose}mg` : '') +
    (d.pain != null ? ` — Pain ${d.pain}/10` : '')
  ).join('\n');
  if (navigator.share) {
    navigator.share({ title: 'Medication Log', text }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => toast('Log copied to clipboard'));
  }
}

function render() {
  const now = Date.now();
  $('meds').innerHTML = meds.map(m => {
    const last = lastDose(m.id);
    let cd, sub;
    if (!last) {
      cd = `<div class="countdown cd-none">No doses logged yet</div>`;
      sub = `Tap Take when you take it`;
    } else {
      const nextAt = last.takenAt + m.hours * 3600e3;
      const doseSub = last.dose != null ? ` · ${last.dose}mg` : '';
      const painSub = last.pain != null ? ` · pain ${last.pain}/10` : '';
      if (now >= nextAt) {
        cd = `<div class="countdown cd-ok">✅ OK to take now</div>`;
        sub = `Was due ${fmt(nextAt)} · last taken ${fmt(last.takenAt)}${doseSub}${painSub}`;
      } else {
        cd = `<div class="countdown cd-wait" data-next="${nextAt}">${remainStr(nextAt - now)}</div>`;
        sub = `Next dose ${fmt(nextAt)} · last taken ${fmt(last.takenAt)}${doseSub}${painSub}`;
      }
    }
    const calBtn = last && now < last.takenAt + m.hours*3600e3
      ? `<button class="cal-btn" onclick="calAlert('${m.id}')">📅 Alert</button>` : '';
    return `<div class="card">
      <div class="med-top">
        <div class="med-name">${esc(m.name)} <span class="badge">${m.dose != null ? esc(m.dose) + 'mg · ' : ''}every ${m.hours}h</span></div>
        <button class="edit-btn" onclick="editMed('${m.id}')">✎</button>
      </div>
      ${cd}<div class="sub">${sub}</div>
      <div class="row">
        <button class="take-btn" onclick="takeDose('${m.id}')">TAKE ${esc(m.name.toUpperCase())} NOW</button>
        ${calBtn}
      </div>
    </div>`;
  }).join('') || `<div class="empty">No medications — tap ＋ Add</div>`;

  $('log').innerHTML = doses.slice(0, 200).map(d => {
    const doseStr = d.dose != null ? ` · ${d.dose}mg` : '';
    const painStr = d.pain != null ? ` · <b style="color:${painColor(d.pain)}">pain ${d.pain}/10</b>` : '';
    return `<div class="log-entry"><div><b>${esc(d.name)}</b> <span class="when">· ${fmt(d.takenAt)} · every ${d.hours}h${doseStr}${painStr}</span><br>
     Next dose: ${fmt(d.takenAt + d.hours*3600e3)}</div>
     <button class="del" onclick="delDose('${d.id}')">✕</button></div>`;
  }).join('') || `<div class="empty">Doses you log will appear here</div>`;
}

// per-second tick: update countdown text only; full render when one expires
setInterval(() => {
  const now = Date.now();
  let needFull = false;
  document.querySelectorAll('.cd-wait[data-next]').forEach(el => {
    const nextAt = +el.dataset.next;
    if (now >= nextAt) needFull = true;
    else el.textContent = remainStr(nextAt - now);
  });
  if (needFull) render();
}, 1000);

render();
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
