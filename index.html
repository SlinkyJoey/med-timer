<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Medwise</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Medwise">
<meta name="theme-color" content="#0e1116">
<style>
  :root {
    --bg: #0e1116; --card: #1a1f29; --card2: #232a37;
    --text: #eef1f6; --dim: #8b94a3;
    --red: #ff6b6b; --green: #4cd97b; --amber: #ffb454; --blue: #5aa9ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, select, input, textarea { font-family: inherit; }
  button { touch-action: manipulation; cursor: pointer; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 520px; margin: 0 auto;
  }
  h1 { font-size: 21px; padding: 8px 2px 14px; display: flex; align-items: center;
       justify-content: space-between; gap: 8px; white-space: nowrap; }
  h1 .add-btn {
    font-size: 14px; font-weight: 600; color: var(--blue); background: var(--card);
    border: none; border-radius: 11px; padding: 9px 11px; white-space: nowrap;
  }
  .section { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
             color: var(--dim); padding: 8px 2px 8px; }
  .card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .med-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .med-name { font-size: 21px; font-weight: 700; }
  .badge { font-size: 13px; font-weight: 600; color: var(--dim); background: var(--card2);
           border-radius: 8px; padding: 4px 9px; white-space: nowrap; display: inline-block; margin-top: 6px; }
  .reason { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .edit-btn { background: none; border: none; color: var(--dim); font-size: 17px; padding: 6px 8px; }
  .countdown {
    font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 42px; font-weight: 700; letter-spacing: 1px; line-height: 1.15; margin-top: 10px;
  }
  .cd-wait { color: var(--amber); }
  .cd-ok { color: var(--green); font-size: 30px; font-family: -apple-system, sans-serif; letter-spacing: 0; }
  .cd-none { color: var(--dim); font-size: 17px; font-family: -apple-system, sans-serif; font-weight: 500; letter-spacing: 0; }
  .sub { color: var(--dim); font-size: 14px; margin-top: 4px; min-height: 18px; }
  .tally { font-size: 13px; font-weight: 600; margin-top: 5px; color: var(--dim); }
  .tally.warn { color: var(--amber); }
  .tally.over { color: var(--red); }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .take-btn { flex: 1; font-size: 18px; font-weight: 700; color: #fff; background: var(--red);
              border: none; border-radius: 14px; padding: 15px 0; }
  .take-btn:active { opacity: .8; }
  .cal-btn { font-size: 15px; font-weight: 600; color: var(--blue); background: var(--card2);
             border: none; border-radius: 14px; padding: 0 16px; }
  h2 { font-size: 17px; color: var(--dim); padding: 14px 2px 10px; display: flex; justify-content: space-between; align-items: center; }
  h2 .actions { display: flex; gap: 16px; }
  h2 button { background: none; border: none; color: var(--blue); font-size: 15px; font-weight: 600; padding: 0; }
  .log-entry { background: var(--card); border-radius: 12px; padding: 11px 14px; margin-bottom: 8px;
               font-size: 14px; line-height: 1.45; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .log-entry .when { color: var(--dim); }
  .log-entry .del { background: none; border: none; color: var(--dim); font-size: 15px; padding: 4px 6px; flex-shrink: 0; }
  .empty { color: var(--dim); font-size: 15px; text-align: center; padding: 20px 0; }
  .footer-btn { display: block; width: 100%; background: none; border: none; color: var(--dim);
                font-size: 14px; font-weight: 600; padding: 18px 0 4px; }
  .groups { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .group-chip { display: flex; align-items: center; background: var(--card); border-radius: 14px; }
  .group-chip .glog { background: none; border: none; color: var(--text); font-size: 15px; font-weight: 700; padding: 13px 4px 13px 15px; text-align: left; }
  .group-chip .glog small { color: var(--dim); font-weight: 600; margin-left: 6px; }
  .group-chip .gedit { background: none; border: none; color: var(--dim); font-size: 15px; padding: 13px 13px; }
  .group-add { background: none; border: 1px dashed #333c4d; color: var(--blue); border-radius: 14px; padding: 13px 16px; font-size: 15px; font-weight: 600; }
  .check-list { max-height: 46vh; overflow-y: auto; margin: 6px 0 12px; }
  .check-row { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid #232a37; font-size: 16px; }
  .check-row input { width: 22px; height: 22px; accent-color: var(--blue); flex-shrink: 0; }
  .dlg-in { color-scheme: dark; }
  .log-entry { cursor: pointer; }

  /* ---- Insights / charts ---- */
  .viz-sheet { background: var(--bg); border-radius: 20px; width: 100%; max-width: 460px;
               max-height: 92vh; overflow-y: auto; padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); }
  .viz-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .viz-head .dlg-title { margin: 0; }
  .viz-close { background: var(--card2); border: none; color: var(--text); border-radius: 12px; padding: 9px 14px; font-size: 15px; font-weight: 600; }
  .seg { display: flex; background: var(--card); border-radius: 12px; padding: 3px; margin-bottom: 14px; }
  .seg button { flex: 1; background: none; border: none; color: var(--dim); font-size: 14px; font-weight: 600; padding: 9px 0; border-radius: 9px; }
  .seg button.on { background: var(--card2); color: var(--text); }
  .viz-card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .viz-title { font-size: 15px; font-weight: 700; }
  .viz-sub { font-size: 12px; color: var(--dim); margin: 2px 0 10px; }
  .viz-svg { width: 100%; height: auto; display: block; overflow: visible; }
  .viz-empty { color: var(--dim); font-size: 13px; text-align: center; padding: 18px 0; }
  .viz-stat { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hm-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .hm-cell { aspect-ratio: 1; border-radius: 4px; background: #232a37; display: flex;
             align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
             font-variant-numeric: tabular-nums; }
  .hm-dow { font-size: 10px; color: var(--dim); text-align: center; font-weight: 600; }
  .hm-legend { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--dim); margin-top: 9px; justify-content: flex-end; }
  .hm-legend i { width: 13px; height: 13px; border-radius: 3px; display: inline-block; }
  .viz-tip { position: fixed; background: var(--card2); color: var(--text); font-size: 12px; font-weight: 600;
             padding: 7px 10px; border-radius: 9px; pointer-events: none; opacity: 0; transition: opacity .12s;
             box-shadow: 0 4px 16px rgba(0,0,0,.5); z-index: 120; white-space: nowrap; }
  .viz-tip.on { opacity: 1; }

  /* ---- Add to Home Screen ---- */
  .install-btn { display: block; width: 100%; margin-top: 22px; background: var(--card);
                 border: 1px solid #333c4d; color: var(--blue); border-radius: 14px;
                 padding: 15px 0; font-size: 15px; font-weight: 700; }
  .install-btn[hidden], .ins-banner[hidden] { display: none; }
  .ins-banner { display: flex; align-items: center; gap: 11px; background: var(--card);
                border: 1px solid #333c4d; border-radius: 16px; padding: 11px 12px; margin-bottom: 14px; }
  .ins-banner img { width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0; }
  .ins-banner .txt { flex: 1; min-width: 0; line-height: 1.3; }
  .ins-banner .txt b { font-size: 14px; display: block; }
  .ins-banner .txt span { font-size: 12px; color: var(--dim); }
  .ins-banner .go { background: var(--blue); border: none; color: #fff; border-radius: 10px;
                    padding: 9px 13px; font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .ins-banner .x { background: none; border: none; color: var(--dim); font-size: 15px; padding: 6px; flex-shrink: 0; }
  .ins-icon { width: 76px; height: 76px; border-radius: 17px; display: block; margin: 4px auto 14px;
              box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .ins-step { display: flex; gap: 11px; align-items: flex-start; font-size: 15px; line-height: 1.45;
              padding: 9px 0; border-bottom: 1px solid #2b3241; }
  .ins-step:last-of-type { border-bottom: none; }
  .ins-num { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--blue);
             color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center;
             justify-content: center; margin-top: 1px; }
  .ins-share { display: inline-block; vertical-align: -4px; margin: 0 1px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 30px);
           background: var(--card2); color: var(--text); padding: 12px 20px; border-radius: 14px;
           font-size: 15px; font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none;
           box-shadow: 0 6px 24px rgba(0,0,0,.45); max-width: 86vw; text-align: center; z-index: 99; }
  .toast.show { opacity: 1; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50;
             display: flex; align-items: center; justify-content: center; padding: 20px; }
  .sheet { background: var(--card2); border-radius: 20px; padding: 20px; width: 100%; max-width: 400px;
           box-shadow: 0 12px 40px rgba(0,0,0,.5); max-height: 90vh; overflow-y: auto; }
  .dlg-title { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
  .dlg-msg { font-size: 15px; color: var(--dim); line-height: 1.45; margin-bottom: 14px; white-space: pre-line; }
  .dlg-in { width: 100%; background: var(--bg); color: var(--text); border: 1px solid #333c4d;
            border-radius: 12px; padding: 13px 14px; font-size: 17px; margin-bottom: 10px; }
  select.dlg-in { appearance: none; -webkit-appearance: none; }
  textarea.dlg-in { min-height: 110px; resize: vertical; }
  .dlg-row { display: flex; gap: 10px; margin-top: 8px; }
  .dlg-btn { flex: 1; border: none; border-radius: 12px; padding: 14px 0; font-size: 16px; font-weight: 600; }
  .dlg-cancel { background: var(--card); color: var(--text); }
  .dlg-ok { background: var(--blue); color: #fff; }
  .dlg-ok.danger { background: var(--red); }
  .dlg-extra { background: none; border: none; color: var(--red); font-size: 15px; font-weight: 600; padding: 12px 0 2px; width: 100%; text-align: center; }
  .dlg-skip { background: var(--card); color: var(--text); }
  .dlg-label { font-size: 13px; color: var(--dim); font-weight: 600; margin: 4px 0 6px; }
  .dlg-total { font-size: 14px; color: var(--green); font-weight: 600; margin: -2px 0 10px; min-height: 18px; }
  .pain-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 2px 0 12px; }
  .pain-chip { border: none; border-radius: 12px; padding: 15px 0; font-size: 18px; font-weight: 700; color: #10151c; }
  .pain-chip:active { transform: scale(.94); }
</style>
</head>
<body>
<h1>💊 Medwise <span style="display:flex;gap:6px">
  <button class="add-btn" style="padding:10px 12px" onclick="openInsights()">📊</button>
  <button class="add-btn" id="syncBtn" onclick="openSync()">☁️ Sync</button>
  <button class="add-btn" onclick="addMed()">＋ Add</button>
</span></h1>
<div class="ins-banner" id="installBanner" hidden>
  <img src="icon-180.png" alt="">
  <div class="txt"><b>Add Medwise to your Home Screen</b><span>Opens fullscreen · works offline</span></div>
  <button class="go" onclick="addToHome()">Add</button>
  <button class="x" onclick="dismissInstall()" aria-label="Dismiss">✕</button>
</div>
<div id="groups" class="groups"></div>
<div id="meds"></div>
<button class="footer-btn" onclick="starterPrompt(true)">↺ Load standard medication list</button>
<h2>History <span class="actions">
  <button onclick="backupData()">Backup</button>
  <button onclick="restoreData()">Restore</button>
  <button onclick="exportLog()">Share / Copy</button>
</span></h2>
<button class="footer-btn" style="text-align:left;padding:0 0 10px" onclick="addPastDose()">＋ Add a dose you forgot</button>
<div id="log"></div>
<button class="install-btn" id="installBtn" onclick="addToHome()" hidden>📲 Add app to Home Screen</button>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $ = id => document.getElementById(id);
const MEDS_KEY = 'mt.meds', DOSES_KEY = 'mt.doses', SEED_FLAG = 'mt.starterV2';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY = 86400e3;

// User's medication base. strength = mg per tablet (tablet-based dosing);
// meds with no strength are logged in mg directly (e.g. variable-strength Endone).
// maxPerDay tracks against the user's own stated frequency/limit.
const STARTER_MEDS = [
  { id:'coloxyl',       name:'Coloxyl',       category:'scheduled', hours:24, strength:50,  tablets:2, reason:'Constipation', note:'Once nightly',     maxPerDay:{doses:1}, aliases:['coloxyl','docusate'] },
  { id:'ibuprofen',     name:'Ibuprofen',     category:'scheduled', hours:8,  strength:200, tablets:2, reason:'Pain',         note:'3 times a day',    maxPerDay:{doses:3}, aliases:['ibuprofen','nurofen','brufen'] },
  { id:'targin',        name:'Targin',        category:'scheduled', hours:12, strength:15,  tablets:1, reason:'Pain',         note:'Morning & night',  maxPerDay:{doses:2}, aliases:['targin'] },
  { id:'paracetamol',   name:'Paracetamol',   category:'scheduled', hours:6,  strength:500, tablets:2, reason:'Pain',         note:'4 times a day',    maxPerDay:{doses:4}, aliases:['paracetamol','panadol'] },
  { id:'pantoprazole',  name:'Pantoprazole',  category:'scheduled', hours:24, strength:40,  tablets:1, reason:'Stomach protector', note:'Once daily', maxPerDay:{doses:1}, aliases:['pantoprazole','somac'] },
  { id:'metoclopramide',name:'Metoclopramide',category:'prn',       hours:8,  strength:10,  tablets:1, reason:'Nausea',       note:'Up to 3×/day',     maxPerDay:{doses:3}, aliases:['metoclopramide','maxolon'] },
  { id:'ondansetron',   name:'Ondansetron',   category:'prn',       hours:8,  strength:8,   tablets:1, reason:'Nausea',       note:'Up to 3×/day',     maxPerDay:{doses:3}, aliases:['ondansetron','zofran'] },
  { id:'endone',        name:'Endone',        category:'prn',       hours:4,             dose:5,    reason:'Pain',         note:'5–10mg · max 60mg/24h', maxPerDay:{mg:60}, aliases:['endone'] },
  { id:'tapentadol',    name:'Tapentadol',    category:'prn',       hours:6,  strength:50,  tablets:1, reason:'Pain',         note:'6 hourly',         maxPerDay:{doses:4}, aliases:['tapentadol','palexia'] },
];
const cleanMed = m => { const c = { ...m }; delete c.aliases; return c; };

// sync state — declared up here so saveMeds()->scheduleSync() during first-run seeding is safe
const SYNC_KEY = 'mt.syncCode', DEV_KEY = 'mt.deviceId';
let deviceId = localStorage.getItem(DEV_KEY);
if (!deviceId) { deviceId = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(DEV_KEY, deviceId); }
let syncCode = localStorage.getItem(SYNC_KEY) || '';
let db = null, roomRef = null, cryptoKey = null, syncReady = false;
let lastSyncJson = '', syncTimer = null, syncState = 'off';

let freshInstall = false;
let meds = JSON.parse(localStorage.getItem(MEDS_KEY) || 'null');
if (!meds) {
  meds = STARTER_MEDS.map(cleanMed);
  freshInstall = true;
  localStorage.setItem(SEED_FLAG, '1');
  saveMeds();
}
let doses = JSON.parse(localStorage.getItem(DOSES_KEY) || '[]'); // newest first

function saveMeds()  { localStorage.setItem(MEDS_KEY, JSON.stringify(meds)); scheduleSync(); }
function saveDoses() { localStorage.setItem(DOSES_KEY, JSON.stringify(doses)); scheduleSync(); }

const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
function fmt(ts) { const d = new Date(ts); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function remainStr(ms) { const s = Math.max(0, Math.floor(ms/1000)); return `${Math.floor(s/3600)}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`; }
function lastDose(medId) { return doses.find(d => d.medId === medId); }
function dosesIn24h(medId) { const t = Date.now() - DAY; return doses.filter(d => d.medId === medId && d.takenAt >= t).length; }
function mgIn24h(medId)   { const t = Date.now() - DAY; return doses.filter(d => d.medId === medId && d.takenAt >= t).reduce((s,d) => s + (d.dose || 0), 0); }

function doseLabel(d) {
  if (d.tablets != null && d.dose != null) return `${d.tablets} tab (${d.dose}mg)`;
  if (d.tablets != null) return `${d.tablets} tab`;
  if (d.dose != null) return `${d.dose}mg`;
  return '';
}
function medDoseLabel(m) {
  if (m.strength != null) return `${m.tablets ?? 1} × ${m.strength}mg`;
  if (m.dose != null) return `${m.dose}mg`;
  return '';
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800);
}

/* Generic dialog. inputs: [{label?, type?, value?, placeholder?, options?}].
   type 'select' uses options [{value,label}]. Resolves null|'extra'|true|[values]. */
function dialog({ title, message = '', inputs = [], okText = 'OK', cancelText = 'Cancel', danger = false, extraText = null }) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    const field = (f, i) => {
      const lbl = f.label ? `<div class="dlg-label">${esc(f.label)}</div>` : '';
      if (f.type === 'select')
        return lbl + `<select class="dlg-in" id="dlg-in-${i}">` +
          f.options.map(o => `<option value="${esc(o.value)}" ${o.value === f.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('') + `</select>`;
      if (f.type === 'textarea')
        return lbl + `<textarea class="dlg-in" id="dlg-in-${i}" placeholder="${esc(f.placeholder || '')}"></textarea>`;
      return lbl + `<input class="dlg-in" id="dlg-in-${i}" type="text" ${f.type === 'number' ? 'inputmode="decimal"' : ''} placeholder="${esc(f.placeholder || '')}" value="${esc(f.value ?? '')}">`;
    };
    ov.innerHTML = `<div class="sheet">
      <div class="dlg-title">${esc(title)}</div>
      ${message ? `<div class="dlg-msg">${esc(message)}</div>` : ''}
      ${inputs.map(field).join('')}
      <div class="dlg-row">
        <button class="dlg-btn dlg-cancel">${esc(cancelText)}</button>
        <button class="dlg-btn dlg-ok${danger ? ' danger' : ''}">${esc(okText)}</button>
      </div>
      ${extraText ? `<button class="dlg-extra">${esc(extraText)}</button>` : ''}
    </div>`;
    document.body.appendChild(ov);
    const done = v => { ov.remove(); resolve(v); };
    ov.querySelector('.dlg-cancel').addEventListener('click', () => done(null));
    ov.querySelector('.dlg-ok').addEventListener('click', () =>
      done(inputs.length ? inputs.map((_, i) => ov.querySelector(`#dlg-in-${i}`).value) : true));
    if (extraText) ov.querySelector('.dlg-extra').addEventListener('click', () => done('extra'));
    ov.addEventListener('click', e => { if (e.target === ov) done(null); });
  });
}

// pain 0 (green) -> 5 (amber) -> 10 (red)
function painColor(n) {
  const a = [76,217,123], b = [255,180,84], c = [255,107,107];
  const [from, to, t] = n <= 5 ? [a, b, n/5] : [b, c, (n-5)/5];
  const mix = i => Math.round(from[i] + (to[i] - from[i]) * t);
  return `rgb(${mix(0)},${mix(1)},${mix(2)})`;
}

// Combined dose + pain logger. Resolves null (cancel) or { tablets?, dose?, pain? }.
function logDialog(med) {
  const last = lastDose(med.id);
  const tabletMode = med.strength != null;
  const prefill = tabletMode
    ? (last && last.tablets != null ? last.tablets : (med.tablets ?? 1))
    : (last && last.dose != null ? last.dose : (med.dose ?? ''));
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    const chips = Array.from({ length: 11 }, (_, n) =>
      `<button class="pain-chip" style="background:${painColor(n)}" data-pain="${n}">${n}</button>`).join('');
    const ctx = [med.reason, med.note].filter(Boolean).join(' · ');
    ov.innerHTML = `<div class="sheet">
      <div class="dlg-title">Log ${esc(med.name)}</div>
      ${ctx ? `<div class="dlg-msg">${esc(ctx)}</div>` : ''}
      <div class="dlg-label">${tabletMode ? 'Number of tablets' : 'Dosage (mg)'}</div>
      <input class="dlg-in" id="dlg-amt" inputmode="decimal" placeholder="${tabletMode ? 'e.g. 2' : 'e.g. 5'}" value="${esc(prefill)}">
      ${tabletMode ? `<div class="dlg-total" id="dlg-total"></div>` : ''}
      <div class="dlg-label">Pain level — tap a number to log (0 = none, 10 = worst)</div>
      <div class="pain-grid">${chips}</div>
      <div class="dlg-row">
        <button class="dlg-btn dlg-cancel">Cancel</button>
        <button class="dlg-btn dlg-skip">Log, no pain rating</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const amt = ov.querySelector('#dlg-amt');
    const totalEl = ov.querySelector('#dlg-total');
    const upd = () => { if (totalEl) { const t = parseFloat(amt.value); totalEl.textContent = isFinite(t) ? `= ${t * med.strength}mg (${med.strength}mg each)` : ''; } };
    amt.addEventListener('input', upd); upd();
    const read = () => {
      const v = parseFloat(amt.value);
      if (!(isFinite(v) && v >= 0)) return {};
      return tabletMode ? { tablets: v, dose: v * med.strength } : { dose: v };
    };
    const done = v => { ov.remove(); resolve(v); };
    ov.querySelectorAll('.pain-chip').forEach(b =>
      b.addEventListener('click', () => done({ ...read(), pain: +b.dataset.pain })));
    ov.querySelector('.dlg-cancel').addEventListener('click', () => done(null));
    ov.querySelector('.dlg-skip').addEventListener('click', () => done({ ...read(), pain: undefined }));
    ov.addEventListener('click', e => { if (e.target === ov) done(null); });
  });
}

async function takeDose(medId) {
  const m = meds.find(x => x.id === medId);
  if (!m) return;
  const now = Date.now();
  const last = lastDose(medId);
  const warnings = [];
  if (last) {
    const nextAt = last.takenAt + m.hours * 3600e3;
    if (now < nextAt) warnings.push(`Not due for ${remainStr(nextAt - now)} (next at ${fmt(nextAt)}).`);
  }
  if (m.maxPerDay && m.maxPerDay.doses != null) {
    const c = dosesIn24h(medId);
    if (c >= m.maxPerDay.doses) warnings.push(`Already had ${c} in the last 24h — your limit is ${m.maxPerDay.doses}.`);
  }
  if (warnings.length) {
    const ok = await dialog({ title: `⚠️ ${m.name}`, message: warnings.join('\n') + '\n\nLog this dose anyway?', okText: 'Log anyway', danger: true });
    if (ok !== true) return;
  }
  const res = await logDialog(m);
  if (res === null) return;
  if (m.maxPerDay && m.maxPerDay.mg != null && res.dose != null) {
    const sum = mgIn24h(medId) + res.dose;
    if (sum > m.maxPerDay.mg) {
      const ok = await dialog({ title: `⚠️ ${m.name} daily limit`,
        message: `This brings you to ${sum}mg in the last 24h — your limit is ${m.maxPerDay.mg}mg.\n\nLog anyway?`, okText: 'Log anyway', danger: true });
      if (ok !== true) return;
    }
  }
  const takenAt = Date.now();
  const entry = { id: takenAt + '-' + Math.random().toString(36).slice(2, 7), medId, name: m.name, hours: m.hours, takenAt };
  if (res.tablets != null) entry.tablets = res.tablets;
  if (res.dose != null) entry.dose = res.dose;
  if (res.pain != null) entry.pain = res.pain;
  // remember last amount as the default for next time
  if (res.tablets != null) { m.tablets = res.tablets; saveMeds(); }
  else if (res.dose != null && m.strength == null) { m.dose = res.dose; saveMeds(); }
  doses.unshift(entry);
  saveDoses();
  render();
  const dl = doseLabel(entry);
  const bits = [dl, res.pain != null ? `pain ${res.pain}/10` : ''].filter(Boolean).join(', ');
  toast(`${m.name} logged${bits ? ` (${bits})` : ''} — next dose at ${fmt(takenAt + m.hours * 3600e3)}`);
}

function medFormInputs(m) {
  return [
    { label: 'Name', value: m?.name ?? '', placeholder: 'e.g. Ibuprofen' },
    { label: 'Type', type: 'select', value: m?.category ?? 'scheduled',
      options: [{ value: 'scheduled', label: 'Scheduled' }, { value: 'prn', label: 'As needed (PRN)' }] },
    { label: 'Hours between doses', type: 'number', value: m?.hours ?? '', placeholder: 'e.g. 8' },
    { label: 'What it’s for (optional)', value: m?.reason ?? '', placeholder: 'e.g. Pain' },
    { label: 'mg per tablet (optional — leave blank to log in mg)', type: 'number', value: m?.strength ?? '', placeholder: 'e.g. 200' },
    { label: 'Tablets per dose (optional)', type: 'number', value: m?.tablets ?? '', placeholder: 'e.g. 2' },
    { label: 'Max per day (doses, optional)', type: 'number', value: m?.maxPerDay?.doses ?? '', placeholder: 'e.g. 3' },
  ];
}
function readMedForm(r) {
  const name = r[0].trim();
  const category = r[1] === 'prn' ? 'prn' : 'scheduled';
  const hours = parseFloat(r[2]);
  const reason = r[3].trim();
  const strength = parseFloat(r[4]);
  const tablets = parseFloat(r[5]);
  const maxDoses = parseFloat(r[6]);
  if (!name) { toast('Name is required'); return null; }
  if (!(hours > 0 && hours <= 168)) { toast('Hours must be between 0 and 168'); return null; }
  const out = { name, category, hours };
  if (reason) out.reason = reason;
  if (isFinite(strength) && strength > 0) out.strength = strength;
  if (isFinite(tablets) && tablets > 0) out.tablets = tablets;
  if (isFinite(maxDoses) && maxDoses > 0) out.maxPerDay = { doses: maxDoses };
  return out;
}

async function addMed() {
  const r = await dialog({ title: 'Add medication', inputs: medFormInputs(null), okText: 'Add' });
  if (!r) return;
  const data = readMedForm(r);
  if (!data) return;
  meds.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), ...data });
  saveMeds(); render();
  toast(`${data.name} added`);
}

async function editMed(medId) {
  const m = meds.find(x => x.id === medId);
  if (!m) return;
  const r = await dialog({ title: `Edit ${m.name}`, inputs: medFormInputs(m), okText: 'Save', extraText: `Delete ${m.name}…` });
  if (!r) return;
  if (r === 'extra') {
    const sure = await dialog({ title: `Delete ${m.name}?`, message: 'Its history entries are kept.', okText: 'Delete', danger: true });
    if (sure === true) { meds = meds.filter(x => x.id !== medId); saveMeds(); render(); }
    return;
  }
  const data = readMedForm(r);
  if (!data) return;
  Object.assign(m, { reason: undefined, strength: undefined, tablets: undefined, maxPerDay: undefined }, data);
  // keep a remembered mg default for mg-based meds
  if (m.strength != null) delete m.dose;
  saveMeds(); render();
}

async function delDose(doseId) {
  const d = doses.find(x => x.id === doseId);
  if (!d) return;
  const sure = await dialog({ title: 'Remove log entry?', message: `${d.name} · ${fmt(d.takenAt)}`, okText: 'Remove', danger: true });
  if (sure === true) { doses = doses.filter(x => x.id !== doseId); saveDoses(); render(); }
}

// ---- date/time helpers for the native picker ----
function tsToInput(ts) { const d = new Date(ts), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function inputToTs(v) { const t = new Date(v).getTime(); return isNaN(t) ? 0 : t; }

// the default amount a med is taken at (used by groups + forgotten-dose prefill)
function defaultAmount(m) {
  if (m.strength != null) { const t = m.tablets ?? 1; return { tablets: t, dose: t * m.strength }; }
  if (m.dose != null) return { dose: m.dose };
  return {};
}
function defaultDoseLabel(m) { const a = defaultAmount(m); return doseLabel(a) || '—'; }

// pain chip grid + handlers shared by the custom sheets below
function painChipsHTML(sel) {
  return Array.from({ length: 11 }, (_, n) =>
    `<button class="pain-chip" style="background:${painColor(n)};${sel === n ? 'outline:3px solid #fff;outline-offset:-3px' : ''}" data-pain="${n}">${n}</button>`).join('');
}

    toast('Entry updated');

}

/* =================== Insights (charts) ===================
   Every chart here is single-series, so each uses one hue and no legend — the
   title says what is plotted. Pain is always orange, counts always blue, and
   the over-limit status red is reserved for exactly that. */
const VIZ = { pain:'#d95926', count:'#3987e5', critical:'#d03b3b',
              grid:'#2c313d', muted:'#8b94a3', surface:'#1a1f29' };
// Sequential ramp for the pain heatmap: ONE hue (orange), monotone lightness,
// anchored dark near the surface and brightening with pain — never a rainbow.
// Widened lightness spread so mid-range days (where real pain data clusters)
// actually separate; the in-cell number carries the exact value regardless.
const PAIN_RAMP = ['#241a16', '#7d3317', '#c25320', '#f57a35', '#ffb184'];
// pick readable ink for a given cell colour (never rely on colour alone)
function textOn(hex) {
  const [r, g, b] = [1,3,5].map(k => parseInt(hex.slice(k, k+2), 16) / 255)
    .map(c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4));
  return (0.2126*r + 0.7152*g + 0.0722*b) > 0.32 ? '#1a0f08' : 'rgba(255,255,255,.92)';
}
function painRamp(v) {                       // v: 0..10 on an absolute scale
  const x = Math.max(0, Math.min(10, v)) / 10 * (PAIN_RAMP.length - 1);
  const i = Math.min(Math.floor(x), PAIN_RAMP.length - 2), f = x - i;
  const hx = h => [1,3,5].map(k => parseInt(h.slice(k, k+2), 16));
  const a = hx(PAIN_RAMP[i]), b = hx(PAIN_RAMP[i+1]);
  return '#' + a.map((c, k) => Math.round(c + (b[k]-c)*f).toString(16).padStart(2,'0')).join('');
}
let vizPeriod = 30;   // 7 | 30 | 0 (all)

const dayStart = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
const dKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
const round1 = n => Math.round(n * 10) / 10;

function periodStart() {
  if (vizPeriod === 0) return doses.length ? dayStart(Math.min(...doses.map(d => d.takenAt))) : dayStart(Date.now());
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - (vizPeriod - 1));
  return d.getTime();
}
function periodDays() {   // array of day-start timestamps, DST-safe
  const out = [], end = dayStart(Date.now());
  for (const d = new Date(periodStart()); d.getTime() <= end; d.setDate(d.getDate() + 1)) out.push(dayStart(d.getTime()));
  return out;
}
const inPeriod = () => { const s = periodStart(); return doses.filter(d => d.takenAt >= s); };
const isPrn = medId => { const m = meds.find(x => x.id === medId); return m && m.category === 'prn'; };
const shortDay = ts => { const d = new Date(ts); return `${d.getDate()}/${d.getMonth()+1}`; };

// thin labels so they never collide: first, last, and a few evenly spaced
function labelEvery(n) { return n <= 7 ? 1 : Math.ceil(n / 6); }

// ---- generic bar chart (single series) ----
function svgBars(bars, opts = {}) {
  const W = 320, H = opts.h || 132, padL = 26, padR = 10, padT = 12, padB = 20;
  const iw = W - padL - padR, ih = H - padT - padB;
  const maxV = Math.max(opts.yMax || 0, ...bars.map(b => b.v), opts.limit || 0, 1);
  const n = bars.length || 1, band = iw / n, bw = Math.max(2, Math.min(24, band - 2)); // 2px surface gap
  const y = v => padT + ih - (v / maxV) * ih;
  const ticks = [0, maxV / 2, maxV];
  const grid = ticks.map(t => `<line x1="${padL}" y1="${y(t)}" x2="${W-padR}" y2="${y(t)}" stroke="${VIZ.grid}" stroke-width="1"/>` +
    `<text x="${padL-5}" y="${y(t)+3}" text-anchor="end" font-size="9" fill="${VIZ.muted}">${round1(t)}</text>`).join('');
  const limit = opts.limit ? `<line x1="${padL}" y1="${y(opts.limit)}" x2="${W-padR}" y2="${y(opts.limit)}" stroke="${VIZ.critical}" stroke-width="1"/>` +
    `<text x="${W-padR}" y="${y(opts.limit)-4}" text-anchor="end" font-size="9" fill="${VIZ.critical}">${esc(opts.limitLabel || ('limit ' + opts.limit))}</text>` : '';
  const rects = bars.map((b, i) => {
    if (!(b.v > 0)) return '';
    const h = (b.v / maxV) * ih, x = padL + i * band + (band - bw) / 2, yy = padT + ih - h;
    const r = Math.min(4, bw / 2, h);   // 4px rounded data-end, square at baseline
    const col = b.over ? VIZ.critical : (opts.color || VIZ.count);
    return `<path d="M${x},${padT+ih} L${x},${yy+r} Q${x},${yy} ${x+r},${yy} L${x+bw-r},${yy} Q${x+bw},${yy} ${x+bw},${yy+r} L${x+bw},${padT+ih} Z" fill="${col}" data-tip="${esc(b.tip||'')}"/>`;
  }).join('');
  const step = opts.labelEvery || 1;
  const labels = bars.map((b, i) => (b.label && (i % step === 0 || i === bars.length - 1))
    ? `<text x="${padL + i*band + band/2}" y="${H-5}" text-anchor="middle" font-size="9" fill="${VIZ.muted}">${esc(b.label)}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="viz-svg">${grid}${limit}${rects}${labels}</svg>`;
}

// ---- pain line chart ----
function svgPainLine(pts) {
  const W = 320, H = 140, padL = 22, padR = 12, padT = 12, padB = 20;
  const iw = W - padL - padR, ih = H - padT - padB;
  const t0 = pts[0].t, t1 = pts[pts.length-1].t;
  const x = t => padL + (t1 === t0 ? iw/2 : ((t - t0) / (t1 - t0)) * iw);
  const y = v => padT + ih - (v / 10) * ih;
  const grid = [0,5,10].map(v => `<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="${VIZ.grid}" stroke-width="1"/>` +
    `<text x="${padL-5}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="${VIZ.muted}">${v}</text>`).join('');
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${round1(x(p.t))},${round1(y(p.v))}`).join(' ');
  const line = `<path d="${d}" fill="none" stroke="${VIZ.pain}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  // markers only when sparse enough to stay readable; 2px surface ring
  const dots = pts.length <= 14 ? pts.map(p =>
    `<circle cx="${round1(x(p.t))}" cy="${round1(y(p.v))}" r="4" fill="${VIZ.pain}" stroke="${VIZ.surface}" stroke-width="2" data-tip="${esc(p.tip)}"/>`).join('') : '';
  const last = pts[pts.length-1];
  const endLbl = `<circle cx="${round1(x(last.t))}" cy="${round1(y(last.v))}" r="4" fill="${VIZ.pain}" stroke="${VIZ.surface}" stroke-width="2" data-tip="${esc(last.tip)}"/>` +
    `<text x="${round1(x(last.t))-6}" y="${round1(y(last.v))-8}" text-anchor="end" font-size="11" font-weight="700" fill="${VIZ.pain}">${round1(last.v)}</text>`;
  const xl = `<text x="${padL}" y="${H-5}" font-size="9" fill="${VIZ.muted}">${esc(shortDay(t0))}</text>` +
             `<text x="${W-padR}" y="${H-5}" text-anchor="end" font-size="9" fill="${VIZ.muted}">${esc(shortDay(t1))}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="viz-svg">${grid}${line}${dots}${endLbl}${xl}</svg>`;
}

// ---- the six charts ----
function chartPainTrend() {
  const rated = inPeriod().filter(d => d.pain != null);
  if (rated.length < 2) return vizCard('Pain trend', 'Average pain per day', vizEmpty('Log a couple more pain ratings and this fills in.'));
  const byDay = new Map();
  rated.forEach(d => { const k = dayStart(d.takenAt); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(d.pain); });
  let pts = [...byDay.entries()].sort((a,b) => a[0]-b[0])
    .map(([t, arr]) => ({ t, v: arr.reduce((s,x)=>s+x,0)/arr.length, n: arr.length }));
  let sub = 'Average pain per day';
  if (vizPeriod === 0 && pts.length > 21) {   // zoom out to weekly averages
    const byWeek = new Map();
    pts.forEach(p => { const d = new Date(p.t); d.setDate(d.getDate() - ((d.getDay()+6)%7)); d.setHours(0,0,0,0);
      const k = d.getTime(); if (!byWeek.has(k)) byWeek.set(k, []); byWeek.get(k).push(p.v); });
    pts = [...byWeek.entries()].sort((a,b)=>a[0]-b[0]).map(([t,a]) => ({ t, v: a.reduce((s,x)=>s+x,0)/a.length, n: a.length }));
    sub = 'Average pain per week';
  }
  pts.forEach(p => p.tip = `${shortDay(p.t)} · pain ${round1(p.v)}/10`);
  const avg = round1(rated.reduce((s,d)=>s+d.pain,0) / rated.length);
  return vizCard('Pain trend', `${sub} · ${rated.length} rating${rated.length===1?'':'s'}, average ${avg}/10`, svgPainLine(pts));
}

function chartPainByTime() {
  const buckets = [ {label:'Night', h:[0,5]}, {label:'Morning', h:[6,11]}, {label:'Afternoon', h:[12,17]}, {label:'Evening', h:[18,23]} ];
  const rated = inPeriod().filter(d => d.pain != null);
  if (!rated.length) return vizCard('Pain by time of day', 'When your pain runs highest', vizEmpty('No pain ratings in this period yet.'));
  const bars = buckets.map(b => {
    const hits = rated.filter(d => { const h = new Date(d.takenAt).getHours(); return h >= b.h[0] && h <= b.h[1]; });
    const v = hits.length ? hits.reduce((s,d)=>s+d.pain,0)/hits.length : 0;
    return { label: b.label, v, tip: hits.length ? `${b.label} · avg ${round1(v)}/10 (${hits.length})` : `${b.label} · no data` };
  });
  const best = bars.filter(b=>b.v>0).sort((a,b)=>b.v-a.v)[0];
  return vizCard('Pain by time of day', best ? `Worst around ${best.label.toLowerCase()} — average ${round1(best.v)}/10` : 'When your pain runs highest',
    svgBars(bars, { yMax: 10, color: VIZ.pain }));
}

function chartHeatmap() {
  const weeks = 6, cells = [];
  const end = new Date(); end.setHours(0,0,0,0);
  const start = new Date(end); start.setDate(start.getDate() - (weeks*7 - 1));
  start.setDate(start.getDate() - ((start.getDay()+6)%7));   // back to Monday
  const byDay = new Map();
  doses.filter(d => d.pain != null).forEach(d => { const k = dKey(d.takenAt); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(d.pain); });
  if (!byDay.size) return vizCard('Pain calendar', 'Each day shaded by average pain', vizEmpty('No pain ratings logged yet.'));
  for (const d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
    const arr = byDay.get(dKey(d.getTime()));
    const v = arr ? arr.reduce((s,x)=>s+x,0)/arr.length : null;
    const bg = v == null ? '#232a37' : painRamp(v);
    const num = v == null ? '' : `<span style="color:${textOn(bg)}">${Math.round(v)}</span>`;
    cells.push(`<div class="hm-cell" style="background:${bg}" data-tip="${esc(v==null ? `${shortDay(d.getTime())} · no rating` : `${shortDay(d.getTime())} · pain ${round1(v)}/10`)}">${num}</div>`);
  }
  const dow = ['M','T','W','T','F','S','S'].map(x => `<div class="hm-dow">${x}</div>`).join('');
  const legend = `<div class="hm-legend">0
    ${[0,2.5,5,7.5,10].map(v=>`<i style="background:${painRamp(v)}"></i>`).join('')} 10 pain</div>`;
  return vizCard('Pain calendar', 'Each day shaded by average pain — last 6 weeks',
    `<div class="hm-grid">${dow}${cells.join('')}</div>${legend}`);
}

function chartBreakthrough() {
  const days = periodDays();
  const prn = inPeriod().filter(d => isPrn(d.medId));
  if (!prn.length) return vizCard('Breakthrough (PRN) doses', 'As-needed meds used per day', vizEmpty('No as-needed doses logged in this period.'));
  const bars = days.map(t => {
    const n = prn.filter(d => dayStart(d.takenAt) === t).length;
    return { label: shortDay(t), v: n, tip: `${shortDay(t)} · ${n} PRN dose${n===1?'':'s'}` };
  });
  const total = prn.length, perDay = round1(total / days.length);
  return vizCard('Breakthrough (PRN) doses', `As-needed meds per day · ${total} total, ${perDay}/day average`,
    svgBars(bars, { labelEvery: labelEvery(bars.length) }));
}

function chartMgVsLimit() {
  const capped = meds.filter(m => m.maxPerDay && m.maxPerDay.mg != null);
  if (!capped.length) return '';
  const days = periodDays();
  return capped.map(m => {
    const mine = inPeriod().filter(d => d.medId === m.id);
    if (!mine.length) return vizCard(`${m.name} per day`, `Against your ${m.maxPerDay.mg}mg / 24h limit`, vizEmpty(`No ${m.name} logged in this period.`));
    const bars = days.map(t => {
      const mg = mine.filter(d => dayStart(d.takenAt) === t).reduce((s,d) => s + (d.dose||0), 0);
      return { label: shortDay(t), v: mg, over: mg > m.maxPerDay.mg, tip: `${shortDay(t)} · ${mg}mg${mg > m.maxPerDay.mg ? ' — over limit' : ''}` };
    });
    const overDays = bars.filter(b => b.over).length;
    return vizCard(`${m.name} per day`, overDays ? `⚠️ Over your ${m.maxPerDay.mg}mg limit on ${overDays} day${overDays===1?'':'s'}` : `Always within your ${m.maxPerDay.mg}mg / 24h limit`,
      svgBars(bars, { limit: m.maxPerDay.mg, limitLabel: `${m.maxPerDay.mg}mg limit`, labelEvery: labelEvery(bars.length) }));
  }).join('');
}

function chartAdherence() {
  const sched = meds.filter(m => m.category !== 'prn');
  const expected = sched.reduce((s,m) => s + ((m.maxPerDay && m.maxPerDay.doses) || Math.floor(24 / m.hours) || 1), 0);
  if (!sched.length || !expected) return '';
  const days = periodDays();
  const mine = inPeriod().filter(d => !isPrn(d.medId));
  if (!mine.length) return vizCard('Scheduled doses taken', `Out of about ${expected} a day`, vizEmpty('No scheduled doses logged in this period.'));
  const bars = days.map(t => {
    const n = mine.filter(d => dayStart(d.takenAt) === t).length;
    return { label: shortDay(t), v: n, tip: `${shortDay(t)} · ${n} of ~${expected} taken` };
  });
  const done = bars.reduce((s,b) => s + Math.min(b.v, expected), 0);
  const pct = Math.round((done / (expected * days.length)) * 100);
  return vizCard('Scheduled doses taken', `About ${pct}% of your ~${expected}/day routine over this period`,
    svgBars(bars, { limit: expected, limitLabel: `${expected}/day`, labelEvery: labelEvery(bars.length) }));
}

const vizEmpty = msg => `<div class="viz-empty">${esc(msg)}</div>`;
const vizCard = (title, sub, body) => `<div class="viz-card"><div class="viz-title">${esc(title)}</div><div class="viz-sub">${esc(sub)}</div>${body}</div>`;

function renderInsights(root) {
  const opts = [[7,'Week'],[30,'Month'],[0,'All']];
  root.querySelector('#viz-seg').innerHTML = opts.map(([v,l]) =>
    `<button class="${vizPeriod===v?'on':''}" data-p="${v}">${l}</button>`).join('');
  root.querySelectorAll('#viz-seg button').forEach(b => b.onclick = () => { vizPeriod = +b.dataset.p; renderInsights(root); });
  const rated = doses.filter(d => d.pain != null).length;
  root.querySelector('#viz-body').innerHTML = doses.length
    ? chartPainTrend() + chartPainByTime() + chartHeatmap() + chartBreakthrough() + chartMgVsLimit() + chartAdherence()
      + (rated === 0 ? `<div class="viz-empty">Tip: tap a pain number when you log a dose and the pain charts come alive.</div>` : '')
    : `<div class="viz-empty">Log a few doses and your charts will appear here.</div>`;
}

/* =================== Add to Home Screen ===================
   iOS gives no programmatic install API (Apple blocks it), so there we show the
   real steps. Android/desktop Chrome fire beforeinstallprompt — there it's one tap. */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; updateInstallBtn(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; updateInstallBtn(); toast('Installed — open it from your Home Screen'); });

const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   // iPadOS
const iosSafari = () => isIOS() && !/crios|fxios|edgios/i.test(navigator.userAgent);

const INS_DISMISS = 'mt.installDismissed';
function dismissInstall() { localStorage.setItem(INS_DISMISS, '1'); updateInstallBtn(); }

// Banner sits at the top so it's never buried under the history. Dismissing it
// drops back to the quiet button at the bottom, so there's always a way in.
function updateInstallBtn() {
  const banner = document.getElementById('installBanner');
  const btn = document.getElementById('installBtn');
  const installed = isStandalone();
  const dismissed = localStorage.getItem(INS_DISMISS) === '1';
  if (banner) banner.hidden = installed || dismissed;
  if (btn) btn.hidden = installed || !dismissed;
}

async function addToHome() {
  if (deferredPrompt) {                       // Android / desktop: real one-tap install
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null; updateInstallBtn();
    if (outcome !== 'accepted') toast('No problem — the button stays here');
    return;
  }
  installSheet();                             // iOS (and anything else): show the steps
}

function installSheet() {
  const share = `<svg class="ins-share" width="15" height="18" viewBox="0 0 15 18" fill="none">
    <path d="M7.5 1v10M7.5 1 4.3 4.2M7.5 1l3.2 3.2" stroke="#5aa9ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  </svg>`;
  const ios = isIOS();
  const steps = ios
    ? [`Tap the Share button ${share} — it's at the <b>bottom</b> of Safari (or top-right on iPad).`,
       `Scroll down the list and tap <b>“Add to Home Screen”</b>.`,
       `Tap <b>Add</b> — Medwise appears on your Home Screen with its own icon.`]
    : [`Open your browser menu (⋮ or ⋯).`,
       `Choose <b>Install app</b> or <b>Add to Home Screen</b>.`,
       `Confirm — Medwise gets its own icon and opens fullscreen.`];

    ${warn}
    ${steps.map((s, i) => `<div class="ins-step"><div class="ins-num">${i+1}</div><div>${s}</div></div>`).join('')}
    <div class="dlg-row"><button class="dlg-btn dlg-ok">Got it</button></div>
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('.dlg-ok').onclick = close;
  ov.addEventListener('click', e => { if (e.target === ov) close(); });

function openInsights() {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="viz-sheet">
    <div class="viz-head"><div class="dlg-title">📊 Insights</div><button class="viz-close">Done</button></div>
    <div class="seg" id="viz-seg"></div>
    <div id="viz-body"></div>
  </div><div class="viz-tip" id="viz-tip"></div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('.viz-close').onclick = close;
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  renderInsights(ov);
  // tap / hover tooltips on any mark carrying data-tip
  const tip = ov.querySelector('#viz-tip');
  const show = e => {
    const el = e.target.closest('[data-tip]');
    if (!el) { tip.classList.remove('on'); return; }
    const r = el.getBoundingClientRect();
    tip.textContent = el.dataset.tip;
    tip.classList.add('on');
    tip.style.left = Math.min(Math.max(8, r.left + r.width/2 - tip.offsetWidth/2), innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + 'px';
  };
  ov.addEventListener('pointerdown', show);
  ov.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') show(e); });
  ov.addEventListener('pointerleave', () => tip.classList.remove('on'));
}

function calAlert(medId) {
  const m = meds.find(x => x.id === medId);
  const last = lastDose(medId);
  if (!m || !last) return;
  const nextAt = new Date(last.takenAt + m.hours * 3600e3);
  const u = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MedTimer//EN','BEGIN:VEVENT',
    `UID:${last.id}@medtimer`, `DTSTAMP:${u(new Date())}`, `DTSTART:${u(nextAt)}`,
    `DTEND:${u(new Date(nextAt.getTime() + 5*60e3))}`, `SUMMARY:Take ${m.name}`,
    'BEGIN:VALARM','TRIGGER:PT0S','ACTION:DISPLAY',`DESCRIPTION:Take ${m.name}`,'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  a.download = `take-${m.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
}

// ---- one-time / on-demand load of the standard medication list (non-destructive) ----
function loadStarterMeds() {
  let added = 0, updated = 0;
  for (const s of STARTER_MEDS) {
    const keys = [s.id, ...(s.aliases || [])].map(norm);
    const existing = meds.find(m => keys.includes(norm(m.id)) || keys.includes(norm(m.name)));
    const fields = cleanMed(s);
    if (existing) {
      delete fields.id;            // keep the existing id so history + countdown stay linked
      Object.assign(existing, fields);
      updated++;
    } else {
      meds.push(fields);
      added++;
    }
  }
  saveMeds(); render();
  toast(`Standard list loaded — ${added} added, ${updated} updated. History kept.`);
}

async function starterPrompt(manual) {
  const ok = await dialog({
    title: manual ? 'Load standard medication list?' : 'Set up your full medication list?',
    message: 'Adds your Scheduled meds (Coloxyl, Ibuprofen, Targin, Paracetamol, Pantoprazole) and '
      + 'PRN meds (Metoclopramide, Ondansetron, Endone, Tapentadol). Existing medications are updated to match, '
      + 'and all your history is kept.',
    okText: 'Set up', cancelText: 'Not now',
  });
  localStorage.setItem(SEED_FLAG, '1');
  if (ok === true) loadStarterMeds();
}

function exportLog() {
  if (!doses.length) { toast('No doses logged yet'); return; }
  const text = doses.map(d =>
    `${fmt(d.takenAt)} — ${d.name} (every ${d.hours}h) — Next dose: ${fmt(d.takenAt + d.hours*3600e3)}` +
    (doseLabel(d) ? ` — ${doseLabel(d)}` : '') +
    (d.pain != null ? ` — Pain ${d.pain}/10` : '')
  ).join('\n');
  if (navigator.share) navigator.share({ title: 'Medication Log', text }).catch(() => {});
  else navigator.clipboard.writeText(text).then(() => toast('Log copied to clipboard'));
}

function backupData() {
  const payload = JSON.stringify({ app: 'medtimer', v: 1, meds, doses });
  const finish = () => toast('Backup copied — paste into Restore on the other device');
  if (navigator.share) navigator.share({ title: 'Medwise backup', text: payload }).catch(() => navigator.clipboard.writeText(payload).then(finish));
  else navigator.clipboard.writeText(payload).then(finish);
}

async function restoreData() {
  const r = await dialog({ title: 'Restore', message: 'Paste a Backup (or lines from Share / Copy):',
    inputs: [{ type: 'textarea', placeholder: 'Paste here' }], okText: 'Restore' });
  if (!r || !r[0].trim()) return;
  const txt = r[0].trim();
  try {
    if (txt.startsWith('{')) {
      const b = JSON.parse(txt);
      if (b.app !== 'medtimer' || !Array.isArray(b.meds) || !Array.isArray(b.doses)) throw 0;
      const sure = await dialog({ title: 'Replace current data?',
        message: `This backup has ${b.meds.length} medications and ${b.doses.length} log entries.`, okText: 'Replace', danger: true });
      if (sure !== true) return;
      meds = b.meds; doses = b.doses;
    } else {
      const items = parseLogLines(txt);
      if (!items.length) throw 0;
      const sure = await dialog({ title: `Import ${items.length} log entr${items.length === 1 ? 'y' : 'ies'}?`,
        message: "They'll be merged with what's already here.", okText: 'Import' });
      if (sure !== true) return;
      mergeImported(items);
    }
    saveMeds(); saveDoses(); render();
    toast('Restore complete');
  } catch { toast("Couldn't read that — paste the exact Backup or Share / Copy text"); }
}

function parseLogLines(txt) {
  const re = /^(\d{1,2}) (\w{3}) (\d{2}):(\d{2}) — (.+?) \(every ([\d.]+)h\)/;
  const out = [];
  for (const line of txt.split('\n')) {
    const m = line.trim().match(re);
    if (!m) continue;
    const mi = MONTHS.indexOf(m[2]);
    if (mi < 0) continue;
    const d = new Date(new Date().getFullYear(), mi, +m[1], +m[3], +m[4]);
    if (d.getTime() > Date.now() + DAY) d.setFullYear(d.getFullYear() - 1);
    const item = { name: m[5], hours: parseFloat(m[6]), takenAt: d.getTime() };
    const tabM = line.match(/(\d+(?:\.\d+)?)\s*tab\b/i);
    if (tabM) item.tablets = parseFloat(tabM[1]);
    const mgM = line.match(/(\d+(?:\.\d+)?)\s*mg\b/i);
    if (mgM) item.dose = parseFloat(mgM[1]);
    const pm = line.match(/Pain (\d+)\/10/i);
    if (pm) item.pain = +pm[1];
    out.push(item);
  }
  return out;
}

function mergeImported(items) {
  for (const it of items) {
    let med = meds.find(x => x.name.toLowerCase() === it.name.toLowerCase());
    if (!med) {
      med = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: it.name, hours: it.hours, category: 'scheduled' };
      meds.push(med);
    }
    const dup = doses.some(d => d.medId === med.id && Math.abs(d.takenAt - it.takenAt) < 60e3);
    if (!dup) {
      const entry = { id: it.takenAt + '-' + Math.random().toString(36).slice(2, 7), medId: med.id, name: med.name, hours: it.hours, takenAt: it.takenAt };
      if (it.tablets != null) entry.tablets = it.tablets;
      if (it.dose != null) entry.dose = it.dose;
      if (it.pain != null) entry.pain = it.pain;
      doses.push(entry);
    }
  }
  doses.sort((a, b) => b.takenAt - a.takenAt);
}

function medCard(m) {
  const now = Date.now();
  const last = lastDose(m.id);
  let cd, sub;
  if (!last) {
    cd = `<div class="countdown cd-none">No doses logged yet</div>`;
    sub = `Tap Take when you take it`;
  } else {
    const nextAt = last.takenAt + m.hours * 3600e3;
    const dl = doseLabel(last) ? ` · ${doseLabel(last)}` : '';
    const pn = last.pain != null ? ` · pain ${last.pain}/10` : '';
    if (now >= nextAt) {
      cd = `<div class="countdown cd-ok">✅ OK to take now</div>`;
      sub = `Was due ${fmt(nextAt)} · last taken ${fmt(last.takenAt)}${dl}${pn}`;
    } else {
      cd = `<div class="countdown cd-wait" data-next="${nextAt}">${remainStr(nextAt - now)}</div>`;
      sub = `Next dose ${fmt(nextAt)} · last taken ${fmt(last.takenAt)}${dl}${pn}`;
    }
  }
  // 24h tally vs the med's stated limit
  let tally = '';
  if (m.maxPerDay && m.maxPerDay.mg != null) {
    const s = mgIn24h(m.id), over = s > m.maxPerDay.mg, warn = s >= m.maxPerDay.mg;
    tally = `<div class="tally${over ? ' over' : warn ? ' warn' : ''}">Last 24h: ${s} / ${m.maxPerDay.mg} mg</div>`;
  } else if (m.maxPerDay && m.maxPerDay.doses != null) {
    const c = dosesIn24h(m.id), over = c > m.maxPerDay.doses, warn = c >= m.maxPerDay.doses;
    tally = `<div class="tally${over ? ' over' : warn ? ' warn' : ''}">Last 24h: ${c} / ${m.maxPerDay.doses} dose${m.maxPerDay.doses === 1 ? '' : 's'}</div>`;
  } else {
    const c = dosesIn24h(m.id);
    if (c > 0) tally = `<div class="tally">Last 24h: ${c} dose${c === 1 ? '' : 's'}</div>`;
  }
  const reasonLine = [m.reason, m.note].filter(Boolean).join(' · ');
  const badge = medDoseLabel(m);
  const calBtn = last && now < last.takenAt + m.hours*3600e3
    ? `<button class="cal-btn" onclick="calAlert('${m.id}')">📅 Alert</button>` : '';
  return `<div class="card">
    <div class="med-top">
      <div>
        <div class="med-name">${esc(m.name)}</div>
        <span class="badge">${badge ? esc(badge) + ' · ' : ''}every ${m.hours}h</span>
        ${reasonLine ? `<div class="reason">${esc(reasonLine)}</div>` : ''}
      </div>
      <button class="edit-btn" onclick="editMed('${m.id}')">✎</button>
    </div>
    ${cd}<div class="sub">${sub}</div>${tally}
    <div class="row">
      <button class="take-btn" onclick="takeDose('${m.id}')">TAKE ${esc(m.name.toUpperCase())}</button>
      ${calBtn}
    </div>
  </div>`;
}

function render() {
  renderGroups();
  const sched = meds.filter(m => m.category !== 'prn');
  const prn = meds.filter(m => m.category === 'prn');
  let html = '';
  if (sched.length) html += `<div class="section">Scheduled</div>` + sched.map(medCard).join('');
  if (prn.length) html += `<div class="section">As needed (PRN)</div>` + prn.map(medCard).join('');
  $('meds').innerHTML = html || `<div class="empty">No medications — tap ＋ Add</div>`;

  $('log').innerHTML = doses.slice(0, 200).map(d => {
    const dl = doseLabel(d) ? ` · ${doseLabel(d)}` : '';
    const pn = d.pain != null ? ` · <b style="color:${painColor(d.pain)}">pain ${d.pain}/10</b>` : '';
    return `<div class="log-entry" onclick="editDose('${d.id}')"><div><b>${esc(d.name)}</b> <span class="when">· ${fmt(d.takenAt)} · every ${d.hours}h${dl}${pn}</span><br>
     Next dose: ${fmt(d.takenAt + d.hours*3600e3)}</div>
     <span class="del">✎</span></div>`;
  }).join('') || `<div class="empty">Doses you log will appear here</div>`;
}

setInterval(() => {
  const now = Date.now();
  let needFull = false;
  document.querySelectorAll('.cd-wait[data-next]').forEach(el => {
    const nextAt = +el.dataset.next;
    if (now >= nextAt) needFull = true;
    else el.textContent = remainStr(nextAt - now);
  });
  if (needFull) render();
}, 1000);

/* =================== Encrypted cloud sync (Firebase RTDB) ===================
   Data is AES-GCM encrypted on-device with a key derived from the share code,
   and stored under a path that is a hash of that code — so without the code you
   can neither find nor read it. Both devices using the same code stay in sync. */
const _te = new TextEncoder(), _td = new TextDecoder();
const _b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const _unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(code) {
  const base = await crypto.subtle.importKey('raw', _te.encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:_te.encode('medtimer-sync-v1'), iterations:150000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function sha256hex(s) {
  const h = await crypto.subtle.digest('SHA-256', _te.encode(s));
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function encryptObj(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, cryptoKey, _te.encode(JSON.stringify(obj)));
  return { iv:_b64(iv), ct:_b64(ct) };
}
async function decryptObj(rec) {
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:_unb64(rec.iv) }, cryptoKey, _unb64(rec.ct));
  return JSON.parse(_td.decode(pt));
}
function genCode() {
  const al = 'abcdefghjkmnpqrstuvwxyz23456789';   // no ambiguous chars
  const a = new Uint8Array(12); crypto.getRandomValues(a);
  const s = [...a].map(x => al[x % al.length]).join('');
  return `${s.slice(0,4)}-${s.slice(4,8)}-${s.slice(8,12)}`;
}

function setSyncState(s) {
  syncState = s;
  const btn = document.getElementById('syncBtn');
  if (!btn) return;
  const map = { off:'☁️ Sync', connecting:'☁️ …', synced:'☁️ On', error:'☁️ !' };
  btn.textContent = map[s] || '☁️ Sync';
  btn.style.color = s === 'synced' ? 'var(--green)' : s === 'error' ? 'var(--red)' : 'var(--blue)';
}

function scheduleSync() {
  if (!syncReady) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushNow, 700);
}
async function pushNow() {
  if (!syncReady || !roomRef || !cryptoKey) return;
  const j = JSON.stringify({ meds, doses, groups });
  if (j === lastSyncJson) return;             // nothing new since last sync
  lastSyncJson = j;
  try {
    const enc = await encryptObj({ meds, doses, groups });
    await roomRef.set({ ...enc, ts: Date.now(), by: deviceId });
  } catch (e) { setSyncState('error'); }
}

function applyRemote(remote, ts) {
  if (!remote || typeof remote !== 'object') return;
  const byId = new Map((doses || []).map(d => [d.id, d]));
  let changed = false;
  for (const d of (remote.doses || [])) if (!byId.has(d.id)) { byId.set(d.id, d); changed = true; }
  const mergedDoses = [...byId.values()].sort((a, b) => b.takenAt - a.takenAt);
  let mergedMeds = meds;
  if (Array.isArray(remote.meds)) {
    const ids = new Set(meds.map(m => m.id));
    const extra = remote.meds.filter(m => !ids.has(m.id));
    // remote is the latest writer -> adopt its med definitions, plus any local-only meds
    mergedMeds = [...remote.meds, ...meds.filter(m => !new Set(remote.meds.map(x=>x.id)).has(m.id))];
    if (extra.length || remote.meds.length !== meds.length || JSON.stringify(mergedMeds) !== JSON.stringify(meds)) changed = true;
  }
  // groups: adopt remote definitions + keep any local-only groups
  let mergedGroups = groups;
  if (Array.isArray(remote.groups)) {
    const rids = new Set(remote.groups.map(g => g.id));
    mergedGroups = [...remote.groups, ...groups.filter(g => !rids.has(g.id))];
    if (JSON.stringify(mergedGroups) !== JSON.stringify(groups)) changed = true;
  }
  if (changed || mergedDoses.length !== doses.length) {
    meds = mergedMeds; doses = mergedDoses; groups = mergedGroups;
    lastSyncJson = JSON.stringify({ meds, doses, groups });   // prevent echo push
    localStorage.setItem(MEDS_KEY, JSON.stringify(meds));
    localStorage.setItem(DOSES_KEY, JSON.stringify(doses));
    localStorage.setItem('mt.groups', JSON.stringify(groups));
    render();
  }
}

async function syncConnect(code) {
  code = (code || '').trim().toLowerCase();
  if (!code) return false;
  if (!window.firebase || !window.FIREBASE_CONFIG) { toast('Sync unavailable — check your connection'); return false; }
  try {
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    db = firebase.database();
  } catch (e) { toast('Sync setup failed'); return false; }
  cryptoKey = await deriveKey(code);
  const roomId = await sha256hex('medtimer-room:' + code);
  syncCode = code; localStorage.setItem(SYNC_KEY, code);
  if (roomRef) roomRef.off();
  roomRef = db.ref('rooms/' + roomId);
  syncReady = true;
  setSyncState('connecting');
  let first = true;
  roomRef.on('value', async snap => {
    const rec = snap.val();
    if (!rec || !rec.ct) { lastSyncJson = ''; await pushNow(); setSyncState('synced'); first = false; return; }
    if (rec.by !== deviceId) {
      try { applyRemote(await decryptObj(rec), rec.ts || 0); }
      catch (e) { if (first) toast('Could not read synced data — is the code right?'); }
    }
    setSyncState('synced');
    if (first) { first = false; await pushNow(); }   // contribute any local-only data after first pull
  }, () => setSyncState('error'));
  return true;
}

function syncDisconnect() {
  if (roomRef) roomRef.off();
  roomRef = null; syncReady = false; cryptoKey = null; syncCode = '';
  localStorage.removeItem(SYNC_KEY);
  setSyncState('off');
}

function syncSheet() {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  const connected = syncReady && syncCode;
  ov.innerHTML = `<div class="sheet">
    <div class="dlg-title">☁️ Sync across devices</div>
    ${connected ? `
      <div class="dlg-msg">Synced. Share this code with anyone who should see and update your meds (e.g. your wife). On their phone they open this same app, tap Sync, and enter it.</div>
      <div class="dlg-label">Your share code</div>
      <input class="dlg-in" id="sync-code-show" readonly value="${esc(syncCode)}" style="font-size:22px;text-align:center;letter-spacing:2px;font-weight:700">
      <div class="dlg-row">
        <button class="dlg-btn dlg-cancel" id="sync-copy">Copy code</button>
        <button class="dlg-btn dlg-ok" id="sync-share">Share…</button>
      </div>
      <button class="dlg-extra" id="sync-stop">Stop syncing on this device</button>
    ` : `
      <div class="dlg-msg">Turn on sync to keep your phones in step automatically — no backups. Your data is encrypted with your code before it leaves the device.</div>
      <div class="dlg-row">
        <button class="dlg-btn dlg-ok" id="sync-new">Turn on sync</button>
      </div>
      <div class="dlg-label" style="margin-top:14px">Already have a code? Enter it to connect</div>
      <input class="dlg-in" id="sync-code-in" placeholder="xxxx-xxxx-xxxx" autocapitalize="off" autocorrect="off">
      <div class="dlg-row">
        <button class="dlg-btn dlg-cancel" id="sync-close">Close</button>
        <button class="dlg-btn dlg-ok" id="sync-join">Connect</button>
      </div>
    `}
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  if (connected) {
    ov.querySelector('#sync-copy').onclick = () => { navigator.clipboard.writeText(syncCode).then(() => toast('Code copied')); };
    ov.querySelector('#sync-share').onclick = () => {
      const msg = `Open this to follow my meds: https://slinkyjoey.github.io/med-timer/  — then tap ☁️ Sync and enter code: ${syncCode}`;
      if (navigator.share) navigator.share({ text: msg }).catch(() => {});
      else navigator.clipboard.writeText(msg).then(() => toast('Share text copied'));
    };
    ov.querySelector('#sync-stop').onclick = async () => {
      const sure = await dialog({ title: 'Stop syncing on this device?', message: 'Your data stays on this phone; it just stops updating across devices.', okText: 'Stop', danger: true });
      if (sure === true) { syncDisconnect(); close(); toast('Sync turned off'); }
    };
  } else {
    ov.querySelector('#sync-close').onclick = close;
    ov.querySelector('#sync-new').onclick = async () => {
      const code = genCode();
      close();
      const ok = await syncConnect(code);
      if (ok) { setTimeout(syncSheet, 200); toast('Sync on — share your code'); }
    };
    ov.querySelector('#sync-join').onclick = async () => {
      const code = ov.querySelector('#sync-code-in').value.trim();
      if (!code) { toast('Enter a code'); return; }
      close();
      const ok = await syncConnect(code);
      if (ok) toast('Connecting…');
    };
  }
}
function openSync() { syncSheet(); }

render();
updateInstallBtn();
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

// existing installs (had data before this version) get a one-time offer to load the full list
if (!freshInstall && !localStorage.getItem(SEED_FLAG)) starterPrompt(false);

// reconnect sync automatically if this device already has a share code
setSyncState(syncCode ? 'connecting' : 'off');
if (syncCode) {
  const tryConnect = () => window.firebase ? syncConnect(syncCode) : setTimeout(tryConnect, 300);
  tryConnect();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
